openapi: 3.0.3
info:
  title: Smog Shield AI API
  description: |
    Personalized air quality advice API for families and communities facing winter smog.
    
    ## Features
    - Live air quality data from OpenWeather API
    - AI-generated personalized recommendations via Google Gemini
    - Rate limiting and caching for optimal performance
    - Input validation and security controls
    
    ## Authentication
    No authentication required - this is a public API with rate limiting per IP address.
    
    ## Rate Limits
    - `/api/generate`: 5 requests per minute per IP
    - `/api/cities`: 20 requests per minute per IP
    
  version: 1.0.0
  contact:
    name: Smog Shield AI
    url: https://smog-shield-theta.vercel.app
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://smog-shield-theta.vercel.app
    description: Production server
  - url: http://localhost:3000
    description: Development server

tags:
  - name: advice
    description: Air quality advice generation
  - name: cities
    description: City autocomplete and search

paths:
  /api/generate:
    post:
      summary: Generate personalized air quality advice
      description: |
        Generates a personalized action plan based on:
        - Live air quality data for the specified city
        - Household composition and lifestyle factors
        - AI-powered recommendations via Google Gemini
        
        Returns 6 actionable recommendations across 3 categories:
        - Low-emission daily routines
        - Indoor air quality hacks
        - Sustainable alternatives
        
        Each recommendation includes quantified impact estimates.
      tags:
        - advice
      operationId: generateAdvice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifestyleInput'
            examples:
              family_delhi:
                summary: Family in Delhi
                value:
                  city: "Delhi, IN"
                  householdSize: 5
                  hasChildrenOrElderly: true
                  commute: "public_transport"
                  cooking: "lpg"
                  heating: "electric"
                  hasPurifier: false
                  language: "en"
              individual_dehradun:
                summary: Individual in Dehradun
                value:
                  city: "Dehradun"
                  householdSize: 1
                  hasChildrenOrElderly: false
                  commute: "walk_cycle"
                  cooking: "induction"
                  heating: "none"
                  hasPurifier: true
                  language: "hi"
      responses:
        '200':
          description: Successfully generated advice
          headers:
            X-Cache:
              description: Cache status (HIT if cached, absent if fresh)
              schema:
                type: string
                enum: [HIT]
            X-API-Version:
              description: API version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdviceResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_city:
                  value:
                    error: "Invalid input"
                    issues:
                      - path: "city"
                        message: "City is too short"
        '404':
          description: City not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "We couldn't find that city."
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until the rate limit resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Too many requests. Please wait."
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream service failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/cities:
    get:
      summary: Search for cities
      description: |
        Autocomplete endpoint for city name search.
        Returns up to 5 matching cities from OpenWeather Geocoding API.
        Results are deduplicated and cached for 1 hour.
      tags:
        - cities
      operationId: searchCities
      parameters:
        - name: q
          in: query
          required: true
          description: City name search query (2-80 characters)
          schema:
            type: string
            minLength: 2
            maxLength: 80
          examples:
            simple:
              value: "Delhi"
            with_country:
              value: "Dehradun, IN"
      responses:
        '200':
          description: List of matching cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CitySuggestion'
                  version:
                    type: string
                    example: "1.0.0"
              example:
                suggestions:
                  - label: "Delhi, Delhi, IN"
                    value: "Delhi, IN"
                  - label: "New Delhi, Delhi, IN"
                    value: "New Delhi, IN"
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: {}
              example:
                suggestions: []
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: {}
        '502':
          description: Upstream geocoding service failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: {}

components:
  schemas:
    LifestyleInput:
      type: object
      required:
        - city
        - householdSize
        - hasChildrenOrElderly
        - commute
        - cooking
        - heating
        - hasPurifier
      properties:
        city:
          type: string
          minLength: 2
          maxLength: 80
          description: City name with optional country code
          example: "Delhi, IN"
        householdSize:
          type: integer
          minimum: 1
          maximum: 20
          description: Number of people in household
          example: 4
        hasChildrenOrElderly:
          type: boolean
          description: Presence of vulnerable family members
          example: true
        commute:
          type: string
          enum: [walk_cycle, public_transport, two_wheeler, car]
          description: Primary mode of transportation
          example: "public_transport"
        cooking:
          type: string
          enum: [lpg, induction, biomass, piped_gas]
          description: Type of cooking fuel
          example: "lpg"
        heating:
          type: string
          enum: [none, electric, biomass_or_coal, gas]
          description: Type of winter heating
          example: "electric"
        hasPurifier:
          type: boolean
          description: Whether household has an air purifier
          example: false
        language:
          type: string
          enum: [en, hi]
          default: "en"
          description: Output language (English or Hindi)
          example: "en"

    AdviceResponse:
      type: object
      required:
        - aqi
        - advice
      properties:
        aqi:
          $ref: '#/components/schemas/AqiData'
        advice:
          $ref: '#/components/schemas/Advice'
        fallback:
          type: boolean
          description: True if using demo/fallback data due to service unavailability
        version:
          type: string
          example: "1.0.0"

    AqiData:
      type: object
      required:
        - city
        - aqiIndex
        - pm25
        - pm10
      properties:
        city:
          type: string
          example: "Delhi"
        state:
          type: string
          example: "Delhi"
        country:
          type: string
          example: "IN"
        aqiIndex:
          type: integer
          minimum: 1
          maximum: 5
          description: Air Quality Index (1=Good, 5=Very Poor)
          example: 5
        pm25:
          type: number
          minimum: 0
          description: PM2.5 concentration in µg/m³
          example: 247.5
        pm10:
          type: number
          minimum: 0
          description: PM10 concentration in µg/m³
          example: 320.8

    Advice:
      type: object
      required:
        - healthAlert
        - summary
        - actions
      properties:
        healthAlert:
          type: string
          maxLength: 400
          description: Urgent health guidance based on AQI
          example: "Air quality is very poor. Limit outdoor exposure, especially for children and elderly. Use N95/FFP2 masks if going outside."
        summary:
          type: string
          maxLength: 500
          description: Overview of current air quality situation
          example: "Delhi's air quality is hazardous today. PM2.5 levels are 16 times the WHO guideline..."
        actions:
          type: array
          minItems: 3
          maxItems: 9
          items:
            $ref: '#/components/schemas/Action'

    Action:
      type: object
      required:
        - id
        - category
        - title
        - steps
        - whyItWorks
        - impact
        - effort
      properties:
        id:
          type: string
          maxLength: 40
          example: "avoid-peak-hours"
        category:
          type: string
          enum: [routine, indoor, sustainable]
          example: "routine"
        title:
          type: string
          maxLength: 120
          example: "Shift outdoor activities to off-peak hours"
        steps:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            maxLength: 300
          example:
            - "Check hourly AQI forecast (available on weather apps)"
            - "Plan outdoor errands between 2-4 PM when pollution typically dips"
            - "Avoid 6-9 AM and 6-9 PM when traffic emissions peak"
        whyItWorks:
          type: string
          maxLength: 400
          example: "Traffic emissions spike during rush hours. Mid-afternoon typically sees 20-30% lower PM2.5 due to atmospheric mixing."
        impact:
          $ref: '#/components/schemas/Impact'
        effort:
          type: string
          enum: [low, medium, high]
          example: "low"

    Impact:
      type: object
      required:
        - metric
        - estimatedReductionPercent
        - explanation
      properties:
        metric:
          type: string
          maxLength: 80
          example: "Personal PM2.5 exposure"
        estimatedReductionPercent:
          type: number
          minimum: 0
          maximum: 100
          example: 25
        explanation:
          type: string
          maxLength: 300
          example: "Avoiding peak hours can reduce your exposure by approximately 25% based on typical urban pollution patterns."

    CitySuggestion:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
          description: Display label with full location
          example: "Delhi, Delhi, IN"
        value:
          type: string
          description: Value to use in API requests
          example: "Delhi, IN"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
        issues:
          type: array
          description: Validation error details (present for 400 errors)
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
        version:
          type: string
          example: "1.0.0"

  securitySchemes: {}

security: []
